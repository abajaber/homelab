---
# Declarative *arr instance settings — the config that lives in each app's
# SQLite DB and is therefore invisible to the compose reconciler.
#
# Recyclarr owns custom formats, quality definitions and quality profiles.
# THIS file owns everything else that was previously clicked in the UI:
# tags, which indexers/clients each tag routes to, auto-tagging rules,
# release profiles, and series-level enforcement.
#
# Apply with:
#   set -a; eval "$(ansible-vault view servers/truenas/apps/arr/.env)"; set +a
#   python scripts/arr_settings_sync.py                 # plan (default)
#   python scripts/arr_settings_sync.py --apply
#
# Idempotent: every write is preceded by a read and a diff.

# Workstation has no split-DNS for *.bajaber.ca; pin the Traefik host.
dns_overrides:
  sonarr.bajaber.ca: 192.168.1.138
  sonarr-tv.bajaber.ca: 192.168.1.138
  radarr.bajaber.ca: 192.168.1.138

verify_tls: false

instances:
  # --------------------------------------------------------------------------
  # Anime Sonarr.
  # --------------------------------------------------------------------------
  sonarr-anime:
    base_url: https://sonarr.bajaber.ca
    api_prefix: /api/v3
    api_key_env: SONARR_ANIME_API_KEY

    tags:
      - vpn
      - direct
      - anime

    # An indexer carrying a tag is only searched for series carrying the same
    # tag. RSS sync ignores tags, which is why a mis-tagged fleet still looks
    # healthy on the Activity page while every manual search hits one indexer.
    indexer_tags:
      Knaben (Prowlarr): [vpn]
      Nyaa.si (Prowlarr): [vpn]
      AnimeTosho (Prowlarr): [vpn]
      TorrentDownload (Prowlarr): [vpn]
      AnimeZ (Prowlarr): [direct]
      LimeTorrents (Prowlarr): []

    # Same rule for download clients — a series with no matching tag has no
    # eligible client at all and can never grab.
    download_client_tags:
      qBittorrent-vpn: [vpn]
      qBittorrent-direct: [direct]

    auto_tagging:
      # VPN by default, `direct` is opt-in. remove_tags_automatically gives
      # mutual exclusion: tag a series `direct` and `vpn` is pulled off, so
      # nothing ends up with both (two clients at equal priority would then
      # be picked round-robin).
      - name: vpn-default
        remove_tags_automatically: true
        tags: [vpn]
        specifications:
          - name: not-direct
            implementation: TagSpecification
            negate: true
            required: true
            tag_value: direct

    # No release profiles. Declared explicitly (rather than omitted) so the
    # reconciler removes any that appear — a per-series group block was tried
    # here and removed: TRaSH rates VARYG as a good group (Anime Web Tier 04,
    # +300), the failure is a filename/XEM collision specific to Bleach, and
    # blocking it left ToonsHub as the only source above min_format_score.
    prune_release_profiles: true

    # Backfill for the OnSeriesAdd custom script (enforce_anime_type.sh),
    # which only fires for newly added series. Anything added before that
    # script existed keeps seriesType=standard, and standard-type searches
    # never match anime release naming.
    enforce_series_type: anime

    # Every series lands on a recyclarr-managed profile. Without this a series
    # added through the UI keeps Sonarr's stock `Any` — upgradeAllowed=false,
    # cutoff SDTV, every custom format scored 0 — so it accepts an SDTV raw and
    # never upgrades. SAKAMOTO DAYS sat there unnoticed.
    #
    # Profiles are named, not numbered: the ids differ per instance.
    # Quote both sides — several series titles contain a colon.
    default_quality_profile: "Remux-1080p - Anime"
    series_profiles:
      # Dual-audio floor (min_format_score 2000) — opt in per series.
      "The Eminence in Shadow": "Remux-1080p - Anime - Dual Audio"
      "Frieren: Beyond Journey's End": "Remux-1080p - Anime - Dual Audio"

  # --------------------------------------------------------------------------
  # Standard TV Sonarr. Same tag scheme; note the ids differ per instance, so
  # everything here is by label.
  # --------------------------------------------------------------------------
  sonarr-tv:
    base_url: https://sonarr-tv.bajaber.ca
    api_prefix: /api/v3
    api_key_env: SONARR_TV_API_KEY

    tags: [vpn, direct]

    indexer_tags:
      Knaben (Prowlarr): [vpn]
      Nyaa.si (Prowlarr): [vpn]
      TorrentDownload (Prowlarr): [vpn]
      LimeTorrents (Prowlarr): [vpn]
      AnimeZ (Prowlarr): [direct]

    download_client_tags:
      qBittorrent-vpn: [vpn]
      qBittorrent-direct: [direct]

    auto_tagging:
      - name: vpn-default
        remove_tags_automatically: true
        tags: [vpn]
        specifications:
          - name: not-direct
            implementation: TagSpecification
            negate: true
            required: true
            tag_value: direct

    # `UHD Bluray + WEB` (the profile Fallout was on) is a renamed stock Sonarr
    # profile that recyclarr does not manage, carrying a stale partial TRaSH
    # score set — Upscaled, Bad Dual Groups and BR-DISK (BTN) all at 0, so none
    # of them were being blocked. WEB-1080p is the recyclarr-managed one.
    default_quality_profile: "WEB-1080p"

  # --------------------------------------------------------------------------
  # Radarr.
  # --------------------------------------------------------------------------
  radarr:
    base_url: https://radarr.bajaber.ca
    api_prefix: /api/v3
    api_key_env: RADARR_API_KEY

    tags: [vpn, direct]

    indexer_tags:
      Knaben (Prowlarr): [vpn]
      Nyaa.si (Prowlarr): [vpn]
      TorrentDownload (Prowlarr): [vpn]
      AnimeTosho (Prowlarr): [vpn]
      YTS (Prowlarr): [vpn]
      AnimeZ (Prowlarr): [direct]

    download_client_tags:
      qBittorrent-vpn: [vpn]
      qBittorrent-direct: [direct]

    auto_tagging:
      - name: vpn-default
        remove_tags_automatically: true
        tags: [vpn]
        specifications:
          - name: not-direct
            implementation: TagSpecification
            negate: true
            required: true
            tag_value: direct
