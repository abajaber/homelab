---
# Declarative *arr instance settings — the config that lives in each app's
# SQLite DB and is therefore invisible to the compose reconciler.
#
# Recyclarr owns custom formats, quality definitions and quality profiles.
# THIS file owns everything else that was previously clicked in the UI:
# tags, which indexers/clients each tag routes to, auto-tagging rules,
# release profiles, and series-level enforcement.
#
# Apply with:
#   set -a; eval "$(ansible-vault view servers/truenas/apps/arr/.env)"; set +a
#   python scripts/arr_settings_sync.py                 # plan (default)
#   python scripts/arr_settings_sync.py --apply
#
# Idempotent: every write is preceded by a read and a diff.

# Workstation has no split-DNS for *.bajaber.ca; pin the Traefik host.
dns_overrides:
  sonarr.bajaber.ca: 192.168.1.138
  sonarr-tv.bajaber.ca: 192.168.1.138
  radarr.bajaber.ca: 192.168.1.138

verify_tls: false

instances:
  # --------------------------------------------------------------------------
  # Anime Sonarr.
  # --------------------------------------------------------------------------
  sonarr-anime:
    base_url: https://sonarr.bajaber.ca
    api_prefix: /api/v3
    api_key_env: SONARR_ANIME_API_KEY

    tags:
      - vpn
      - direct
      - anime
      - cour-relative-unsafe

    # An indexer carrying a tag is only searched for series carrying the same
    # tag. RSS sync ignores tags, which is why a mis-tagged fleet still looks
    # healthy on the Activity page while every manual search hits one indexer.
    indexer_tags:
      Knaben (Prowlarr): [vpn]
      Nyaa.si (Prowlarr): [vpn]
      AnimeTosho (Prowlarr): [vpn]
      TorrentDownload (Prowlarr): [vpn]
      AnimeZ (Prowlarr): [direct]
      LimeTorrents (Prowlarr): []

    # Same rule for download clients — a series with no matching tag has no
    # eligible client at all and can never grab.
    download_client_tags:
      qBittorrent-vpn: [vpn]
      qBittorrent-direct: [direct]

    auto_tagging:
      # VPN by default, `direct` is opt-in. remove_tags_automatically gives
      # mutual exclusion: tag a series `direct` and `vpn` is pulled off, so
      # nothing ends up with both (two clients at equal priority would then
      # be picked round-robin).
      - name: vpn-default
        remove_tags_automatically: true
        tags: [vpn]
        specifications:
          - name: not-direct
            implementation: TagSpecification
            negate: true
            required: true
            tag_value: direct

    # Delete release profiles not declared below. Needed so a rename actually
    # converges instead of leaving the old profile behind, still filtering.
    prune_release_profiles: true

    release_profiles:
      # Bleach's Thousand-Year Blood War is numbered relative to its own cour
      # (`S01E41`) while TVDB puts it at S17E41. Sonarr matches the release
      # *title*, but on import it parses the *file* name — so what matters is
      # whether the filename still carries something that disambiguates the
      # series. Observed, all single .mkv files with no folder to fall back to:
      #
      #   ToonsHub  BLEACH.Thousand-Year.Blood.War.S01E42...-ToonsHub.mkv  -> S17E42  ok
      #   AnoZu     Bleach.2004.S17E41...-AnoZu.mkv                        -> S17E41  ok
      #   VARYG     BLEACH.S01E41.GOD.OF.THUNDER...-VARYG.mkv              -> 2x21    FAILS
      #
      # So the `S01Exx` form is NOT the discriminator — the alias-stripping is,
      # and it is a per-group naming convention. VARYG drops it (two separate
      # ep41 listings show its bare `Bleach S01E41 ...-VARYG` form; the alias
      # in the third was added by the indexer, not the group). ToonsHub keeps
      # it. Nothing in the release title distinguishes them, so the group name
      # is the only signal available at grab time.
      #
      # Blocking the form instead of the group is what broke S17E42: it
      # rejected all 21 ToonsHub releases (up to score 375), AnoZu had not
      # published that episode, and nothing was left to grab.
      #
      # A negative-scored custom format would be the more idiomatic mechanism.
      # It is not blocked by recyclarr — `reset_unmatched_scores` takes an
      # `except:` / `except_patterns:` list precisely so hand-made formats
      # survive a sync. It is rejected because custom format scores apply to a
      # whole quality profile, so it would block VARYG for every anime series
      # on profile 8. A release profile is tag-scoped, so it hits Bleach only.
      #
      # KNOWN FRAGILITY: only two groups clear `min_format_score: 100` for this
      # show — ToonsHub (375) and VARYG (305). Blocking VARYG leaves ToonsHub
      # as the sole source, so a week where ToonsHub does not publish looks
      # exactly like the S17E42 incident. Judas/Lazier/ESPADAS/KiyoshiiSubs all
      # parse to S17Exx correctly but score 0, so they are excluded by the
      # floor, not by numbering. Dropping the floor to 0 for profile 8 would
      # restore redundancy without admitting the LQ/VOSTFR/Raws groups, which
      # sit at -10000 — but it is a quality-policy change, so it is not made
      # here. `\bVARYG\b` rather than `-VARYG\b`: bracketed group naming
      # (`[ToonsHub] ...`) is live on these indexers, so the leading hyphen
      # cannot be assumed.
      - name: reject alias-stripping groups
        enabled: true
        required: []
        ignored:
          - '/\bVARYG\b/i'
        tags: [cour-relative-unsafe]

    # Backfill for the OnSeriesAdd custom script (enforce_anime_type.sh),
    # which only fires for newly added series. Anything added before that
    # script existed keeps seriesType=standard, and standard-type searches
    # never match anime release naming.
    enforce_series_type: anime

    series_tags:
      Bleach: [cour-relative-unsafe]

  # --------------------------------------------------------------------------
  # Standard TV Sonarr. Same tag scheme; note the ids differ per instance, so
  # everything here is by label.
  # --------------------------------------------------------------------------
  sonarr-tv:
    base_url: https://sonarr-tv.bajaber.ca
    api_prefix: /api/v3
    api_key_env: SONARR_TV_API_KEY

    tags: [vpn, direct]

    indexer_tags:
      Knaben (Prowlarr): [vpn]
      Nyaa.si (Prowlarr): [vpn]
      TorrentDownload (Prowlarr): [vpn]
      LimeTorrents (Prowlarr): [vpn]
      AnimeZ (Prowlarr): [direct]

    download_client_tags:
      qBittorrent-vpn: [vpn]
      qBittorrent-direct: [direct]

    auto_tagging:
      - name: vpn-default
        remove_tags_automatically: true
        tags: [vpn]
        specifications:
          - name: not-direct
            implementation: TagSpecification
            negate: true
            required: true
            tag_value: direct

  # --------------------------------------------------------------------------
  # Radarr.
  # --------------------------------------------------------------------------
  radarr:
    base_url: https://radarr.bajaber.ca
    api_prefix: /api/v3
    api_key_env: RADARR_API_KEY

    tags: [vpn, direct]

    indexer_tags:
      Knaben (Prowlarr): [vpn]
      Nyaa.si (Prowlarr): [vpn]
      TorrentDownload (Prowlarr): [vpn]
      AnimeTosho (Prowlarr): [vpn]
      YTS (Prowlarr): [vpn]
      AnimeZ (Prowlarr): [direct]

    download_client_tags:
      qBittorrent-vpn: [vpn]
      qBittorrent-direct: [direct]

    auto_tagging:
      - name: vpn-default
        remove_tags_automatically: true
        tags: [vpn]
        specifications:
          - name: not-direct
            implementation: TagSpecification
            negate: true
            required: true
            tag_value: direct
