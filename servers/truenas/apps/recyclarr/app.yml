name: recyclarr
enabled: true
# Syncs TRaSH-Guides custom formats + quality profiles into both Sonarr
# instances and Radarr on a cron. The config lives inline in compose.yml as
# a docker `config` (target /config/recyclarr.yml) so it is drift-tracked in
