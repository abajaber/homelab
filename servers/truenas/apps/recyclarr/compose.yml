---
configs:
  recyclarr_yml:
    # Recyclarr's own config. Mounted over the /config bind mount at
    # /config/recyclarr.yml. The api_key placeholders below are resolved from
    # the sibling vault-encrypted .env by the reconciler at apply time.
    #
    # This is the v8 schema. v8 dropped the `includes/` mechanism entirely:
    # quality profiles are now referenced by their TRaSH `trash_id`, and the
    # custom formats they need come with them. `name:` overrides the guide's
    # profile name, which is what keeps the existing profile names (and every
    # series already pointed at them) untouched.
    content: |
      sonarr:
        # ----------------------------------------------------------------
        # Anime instance (`sonarr`). Both profiles are the same TRaSH
        # profile ([Anime] Remux-1080p, min score 100) under the names this
        # fleet already uses; the Dual Audio one just raises the floor so a
        # dual-audio release becomes mandatory.
        # ----------------------------------------------------------------
        anime:
          base_url: http://sonarr:8989
          api_key: ${SONARR_ANIME_API_KEY}
          delete_old_custom_formats: false

          quality_definition:
            type: anime

          quality_profiles:
            - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
              name: Remux-1080p - Anime
              reset_unmatched_scores:
                enabled: true

            - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
              name: Remux-1080p - Anime - Dual Audio
              reset_unmatched_scores:
                enabled: true
              # Anime Dual Audio is scored +2000 below, so this floor makes a
              # dual-audio release mandatory for this profile.
              min_format_score: 2000

          custom_formats:
            - trash_ids:
                - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
              assign_scores_to:
                - name: Remux-1080p - Anime - Dual Audio
                  score: 2000

            # Blocks English-dub-only releases. The guide's own `Dubs Only` is
            # already at -10000 but every one of its specifications matches on
            # release TITLE and needs the literal token "dub"/"dubbed":
            #
            #   ^(?!.*(Dual|Multi)[-_. ]?Audio).*((?<!multi-)\b(dub(bed)?)\b|(funi|eng(lish)?)_?dub)
            #
            # ToonsHub labels theirs "English Audio" instead, so S17E30 of
            # Bleach sailed through at 375 and imported with `audioLanguages:
            # eng` and no Japanese track — beating the dual-audio release of
            # the same episode at 305.
            #
            # Sonarr had already parsed that release as `languages: [English]`,
            # so this CF (a single negated LanguageSpecification on "Original")
            # catches what the title regex cannot. It is opt-in — TRaSH ships
            # it in the `[Optional] Language Profiles` group, not in the anime
            # profile — hence listing it here, which also marks it "matched" so
            # `reset_unmatched_scores` leaves it alone.
            #
            # Checked against all 111 live releases for S17E30: only 6 parse as
            # English-only. The non-dub ones (English-Sub / Eng-Subs, i.e.
            # Japanese audio) already score 0 or -10000, below the profile's
            # min_format_score of 100, so nothing grabbable is lost.
            #
            # Not applied to the Dual Audio profile: that one needs Anime Dual
            # Audio (+2000) to clear its floor, which a dub-only release never
            # carries.
            - trash_ids:
                - ae575f95ab639ba5d15f663bf019e3e8 # Language: Not Original
              assign_scores_to:
                - name: Remux-1080p - Anime
                  score: -10000

        # ----------------------------------------------------------------
        # Standard TV instance (`sonarr-tv`).
        # ----------------------------------------------------------------
        tv:
          base_url: http://sonarr-tv:8989
          api_key: ${SONARR_TV_API_KEY}
          delete_old_custom_formats: false

          quality_definition:
            type: series

          quality_profiles:
            - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
              reset_unmatched_scores:
                enabled: true

          custom_formats:
            # Declared to pin what was already live but undeclared: this score
            # was found set on the profile although the guide's web-1080p does
            # not include any Language CF and `reset_unmatched_scores` had
            # zeroed its neighbours. Kept at the guide's own default rather
            # than changed, so live behaviour is unaffected — the point is that
            # it is now deterministic instead of drift nobody could explain.
            #
            # Harmless for the series on this instance: "Not Original" means
            # not the series' original language, and Fallout's is English.
            - trash_ids:
                - ae575f95ab639ba5d15f663bf019e3e8 # Language: Not Original
              assign_scores_to:
                - name: WEB-1080p
                  score: -10000

          custom_format_groups:
            add:
              - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
                select:
                  - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
              # Both CFs in this group are required, so no `select:` — listing
              # them is redundant and recyclarr warns about it.
              - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
              - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
                select:
                  - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
                  - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
                  - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
                  - 6f808933a71bd9666531610cb8c059cc # BR-DISK (BTN)
                  - fbcb31d8dabd2a319072b84fc0b7249c # Extras
                  - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
                  - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
                  - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled

      radarr:
        main:
          base_url: http://radarr:7878
          api_key: ${RADARR_API_KEY}
          delete_old_custom_formats: false

          quality_definition:
            type: movie

          quality_profiles:
            - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
              reset_unmatched_scores:
                enabled: true

          custom_format_groups:
            add:
              - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
                select:
                  - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
              - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
                select:
                  - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
                  - cae4ca30163749b891686f95532519bd # AV1
                  - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
                  - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
                  - ed38b889b31be83fda192888e2286d83 # BR-DISK
                  - 0a3f082873eb454bde444150b70253cc # Extras
                  - e6886871085226c3da1830830146846c # Generated Dynamic HDR
                  - 90a6f9a284dff5103f6346090e6280c8 # LQ
                  - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
                  - 712d74cd88bceb883ee32f773656b1f5 # Sing-Along Versions
                  - bfd8eb01832d646a0a89c4deb46f8564 # Upscaled

networks:
  media-internal:
    external: true
    name: media-internal

services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    user: 568:568
    environment:
      - TZ=America/toronto
      # Daily at 04:00 local. `recyclarr sync` is idempotent.
      - CRON_SCHEDULE=0 4 * * *
    volumes:
      - /mnt/redsea/apps/recyclarr/config:/config
    configs:
      - source: recyclarr_yml
        target: /config/recyclarr.yml
        mode: 0440
    networks:
      - media-internal
