networks:
  proxy:
    driver: bridge
    name: proxy
services:
  traefik:
    command:
    - --api.dashboard=true
    # Unauthenticated API+dashboard on :8080 — NOT published to the host (no ports
    # mapping below), so only reachable inside the `proxy` network. Lets the
    # Homepage traefik widget read /api/* without the Authentik gate on :443.
    - --api.insecure=true
    container_name: traefik
    environment:
    - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    image: traefik:3
    labels:
      traefik.enable: 'true'
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.rule: Host(`traefik.bajaber.ca`)
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.tls: 'true'
      traefik.http.routers.traefik.tls.certresolver: cloudflare
      traefik.http.routers.traefik.middlewares: authentik@docker
      homepage.group: Infrastructure
      homepage.name: Traefik
      homepage.icon: traefik.png
      homepage.href: https://traefik.bajaber.ca
      homepage.description: Reverse proxy
      homepage.widget.type: traefik
      homepage.widget.url: http://traefik:8080
    networks:
    - proxy
    ports:
    - 80:80
    - 443:443
    restart: unless-stopped
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /mnt/redsea/apps/traefik/:/etc/traefik/
