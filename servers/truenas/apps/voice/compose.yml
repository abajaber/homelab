---
# Shared voice stack — STT + TTS for Home Assistant (Wyoming protocol) AND
# Open WebUI / any OpenAI client (kokoro-fastapi), all maintained components.
#
#   kokoro-fastapi  : OpenAI /v1/audio/speech TTS (English), GPU. Open WebUI
#                     talks to it over ai-net (http://kokoro-fastapi:8880/v1);
#                     HA reaches it via the wyoming-openai bridge.
#   wyoming-openai  : Wyoming->OpenAI bridge so HA can speak via Kokoro (EN).
#   wyoming-piper   : Wyoming TTS, Arabic voice (Kokoro has no Arabic).
#   wyoming-whisper : Wyoming STT — GPU faster-whisper, multilingual large-v3
#                     (NOT distil: distil is English-only and breaks Arabic).
#   openwakeword    : Wyoming wake-word detection (CPU; optional until a
#                     mic'd satellite exists).
#
# HA (network_mode: host) reaches the Wyoming services at 127.0.0.1:<port>:
#   piper 10200 | whisper 10300 | openwakeword 10400 | wyoming-openai 10500.
# Wyoming is raw TCP (not HTTP) so these get no Traefik labels — just host ports.
networks:
  ai-net:
    external: true
    name: ai-net

volumes:
  kokoro-models:
  kokoro-output:

services:
  kokoro-fastapi:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.5.0
    container_name: kokoro-fastapi
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              device_ids:
                - GPU-53c1e32f-a0d4-3a75-aed3-036ea12cd90a
    environment:
      - USE_GPU=true
      - DOWNLOAD_MODEL=true
      - PYTHONUNBUFFERED=1
      - API_LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=GPU-53c1e32f-a0d4-3a75-aed3-036ea12cd90a
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=America/toronto
    # Image runs as UID 1001, but the reconciler stamps dataset binds apps:apps
    # 770 (UID 568) and open-terminal can't chown to 1001 — so use Docker named
    # volumes for the (re-downloadable) model cache + output. Docker initialises
    # them from the image dir (owned 1001), so they're writable; no chown needed.
    volumes:
      - kokoro-models:/app/api/src/models
      - kokoro-output:/app/output
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8880/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  wyoming-openai:
    image: ghcr.io/roryeckel/wyoming_openai:0.5.0
    container_name: wyoming-openai
    restart: unless-stopped
    environment:
      - WYOMING_URI=tcp://0.0.0.0:10500
      - WYOMING_LOG_LEVEL=INFO
      - WYOMING_LANGUAGES=en
      - TTS_OPENAI_URL=http://kokoro-fastapi:8880/v1
      - TTS_MODELS=kokoro
      - TTS_BACKEND=KOKORO_FASTAPI
      - TZ=America/toronto
    ports:
      - "10500:10500"
    networks:
      - ai-net

  wyoming-piper:
    image: rhasspy/wyoming-piper:2.2.2
    container_name: wyoming-piper
    restart: unless-stopped
    command: --voice ar_JO-kareem-medium
    environment:
      - TZ=America/toronto
    ports:
      - "10200:10200"
    volumes:
      - /mnt/redsea/apps/voice/piper:/data
    networks:
      - ai-net

  wyoming-whisper:
    image: lscr.io/linuxserver/faster-whisper:gpu-v3.2.0-ls46
    container_name: wyoming-whisper
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              device_ids:
                - GPU-53c1e32f-a0d4-3a75-aed3-036ea12cd90a
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/toronto
      - WHISPER_MODEL=large-v3
      - WHISPER_BEAM=1
      - WHISPER_LANG=auto
      - NVIDIA_VISIBLE_DEVICES=GPU-53c1e32f-a0d4-3a75-aed3-036ea12cd90a
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "10300:10300"
    volumes:
      - /mnt/redsea/apps/voice/whisper:/config
    networks:
      - ai-net

  openwakeword:
    image: rhasspy/wyoming-openwakeword:2.1.0
    container_name: openwakeword
    restart: unless-stopped
    command: --custom-model-dir /custom
    environment:
      - TZ=America/toronto
    ports:
      - "10400:10400"
    volumes:
      - /mnt/redsea/apps/voice/openwakeword:/custom
    networks:
      - ai-net
