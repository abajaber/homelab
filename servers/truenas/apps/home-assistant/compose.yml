---
# Home Assistant Core (container). network_mode: host is REQUIRED for Google
# Cast + mDNS/zeroconf discovery. ZHA uses the Sonoff ZNP dongle passed through
# by its stable by-id path, mapped to the SAME path in-container so the existing
# ZHA config entry needs no edit. Pinned to 2025.7.4 to match the source VM for
# a byte-clean config restore — upgrade only AFTER the migration is verified.
#
# Reached from outside via Traefik's FILE provider (a host-net container can't be
# discovered by docker labels) — see traefik-file-provider.snippet.yml.
#
# If ZHA can't open the serial device on first boot, set privileged: true.
services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2025.7.4
    container_name: home-assistant
    restart: unless-stopped
    network_mode: host
    privileged: false
    environment:
      - TZ=America/toronto
    devices:
      - "/dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_3ed6580b58a4ed11aa8f82582981d5c7-if00-port0:/dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_3ed6580b58a4ed11aa8f82582981d5c7-if00-port0"
    volumes:
      - /mnt/redsea/apps/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8123/manifest.json').status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
