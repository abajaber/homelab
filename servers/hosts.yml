---
# Inventory: just hosts and how to reach them.
# Per-host config lives in <hostname>/vars.yml + vault.yml at the repo root,
# and is loaded explicitly by each playbook via include_vars.
all:
  hosts:
    truenas:
      ansible_host: truenas.bajaber.ca
      ansible_connection: local
    docker-vm:
      ansible_host: 192.168.1.183
      ansible_user: root
    orange-pi:
      # Orange Pi 5 Plus (RK3588 NPU) — compose-style host, docker-vm pattern.
      # Reached by IP (the ~/.ssh/config `ucdk` alias won't match by IP), so the
      # key is pinned here explicitly.
      ansible_host: 192.168.1.214
      ansible_user: abajaber
      ansible_ssh_private_key_file: /home/abajaber/.ssh/abajaber11
