name: Renovate
on:
  schedule:
    # Daily. Renovate's own `schedule` was removed from renovate.json — with a
    # weekly run, prHourlyLimit capped PR creation at 2/week and the queue never
    # drained. Noise is now controlled by automerge + limits, not by starving
    # the bot of run windows.
    - cron: '0 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46.1.11
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
